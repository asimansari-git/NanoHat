[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanohat"
version = "3.1.0"
description = "NanoHat v3: Autonomous Sub-1B Linux OS Agent powered by FunctionGemma-270M"
readme = "README.md"
authors = [
    { name = "Asim Ibn Akhlaque" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
]

[project.scripts]
nanohat = "runtime.main:main"
nanohat-v3 = "runtime.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

