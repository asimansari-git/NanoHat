[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanohat"
version = "4.0.0"
description = "NanoHat v4: Linux Fedora OS Agent powered by Qwen3-0.6B GRPO"
readme = "README.md"
authors = [
    { name = "asimansari-git" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "ollama>=0.3.0",
]

[project.scripts]
nanohat = "runtime.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

